<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brad Flaugher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Brad Flaugher on X and GitHub.">
  <meta name="theme-color" content="#0f0c0a">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://bradflaugher.com/">

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/favicon-144x144.png">

  <!-- Fonts -->
  <link rel="preload" href="/fonts/Hack-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Open Graph -->
  <meta property="og:site_name" content="Brad Flaugher">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bradflaugher.com/">
  <meta property="og:title" content="Brad Flaugher">
  <meta property="og:description" content="Brad Flaugher on X and GitHub.">
  <meta property="og:image" content="https://bradflaugher.com/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Terminal-style card: brad flaugher, with links to X and GitHub.">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@BradFlaugher">
  <meta name="twitter:creator" content="@BradFlaugher">
  <meta name="twitter:url" content="https://bradflaugher.com/">
  <meta name="twitter:title" content="Brad Flaugher">
  <meta name="twitter:description" content="Brad Flaugher on X and GitHub.">
  <meta name="twitter:image" content="https://bradflaugher.com/og.png">
  <meta name="twitter:image:alt" content="Terminal-style card: brad flaugher, with links to X and GitHub.">

  <style>
    @font-face {
      font-family: 'Hack';
      src: url('/fonts/Hack-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Hack';
      src: url('/fonts/Hack-Italic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'Hack';
      src: url('/fonts/Hack-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Departure Mono';
      src: url('/fonts/DepartureMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ---------- palette: espresso + violet. ours, not a theme pack ---------- */
    :root {
      --bg: #0f0c0a;
      --bg-1: #16120f;
      --bg-2: #1f1915;
      --line: #2f2721;
      --line-hi: #4a3d33;
      --fg: #efe4d2;
      --fg-dim: #bfae98;
      --muted: #7f6f5f;
      --accent: #b48aff;
      --sky: #8fc3d6;
      --mono: 'Hack', ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      --pixel: 'Departure Mono', 'Hack', ui-monospace, Menlo, Consolas, monospace;
      --gutter: clamp(16px, 4vw, 32px);
      --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
      min-height: 100%;
      background: var(--bg);
      background-image:
        radial-gradient(1100px 600px at 12% -10%, rgba(180, 138, 255, 0.11), transparent 60%),
        radial-gradient(800px 500px at 100% 100%, rgba(163, 207, 139, 0.06), transparent 60%);
      background-repeat: no-repeat;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-block: clamp(24px, 6vh, 64px) 0;
      padding-inline: var(--gutter);
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 640px) { body { font-size: 16px; } }

    ::selection { background: var(--accent); color: var(--bg); }

    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 3px; }

    .tui {
      width: 100%;
      max-width: 78ch;
      margin: auto;
      padding-bottom: clamp(24px, 8vh, 96px);
    }

    /* ---------- hero ---------- */
    .hero { padding-top: clamp(28px, 6vw, 40px); }
    .prompt {
      color: var(--muted);
      font-size: 0.85em;
      display: flex; gap: 1ch; align-items: baseline; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .prompt .path { color: var(--sky); }
    .prompt .sym { color: var(--accent); }

    .name {
      margin-top: 4px;
      font-family: var(--pixel);
      font-weight: 400;
      font-size: clamp(38px, 10.5vw, 76px);
      line-height: 0.98;
      letter-spacing: -0.01em;
      color: var(--fg);
      text-wrap: balance;
      margin-bottom: 10px;
      display: flex; flex-wrap: wrap; column-gap: 0.32em; align-items: baseline;
    }
    .name .last { color: var(--accent); }
    .caret {
      display: inline-block;
      width: 0.5em; height: 0.82em;
      background: var(--accent);
      vertical-align: -0.05em;
      margin-left: 0.08em;
      animation: blink 1.1s steps(1, end) infinite;
      transform: translateY(0.05em);
    }
    @keyframes blink { 50% { opacity: 0; } }

    .socials {
      list-style: none;
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-top: 22px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 10px;
      min-height: 44px;
      padding: 8px 14px 8px 12px;
      border: 1px solid var(--line-hi);
      border-radius: 6px;
      background: var(--bg-1);
      color: var(--fg);
      transition: border-color .15s, background .15s, transform .15s;
    }
    .chip:hover { border-color: var(--accent); background: var(--bg-2); transform: translateY(-1px); }
    .chip svg { width: 18px; height: 18px; fill: currentColor; flex: none; }

    /* ---------- status bar footer ---------- */
    .status {
      margin-inline: calc(-1 * var(--gutter));
      padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
      background: var(--bg-1);
      border-top: 1px solid var(--line);
      font-size: 0.8em;
      color: var(--muted);
    }
    .status__inner {
      max-width: 97.5ch; margin: 0 auto; /* 78ch at the body size */
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px;
    }
    .status .seg { display: inline-flex; align-items: center; gap: 1ch; white-space: nowrap; }
    .status a { color: var(--fg-dim); }
    .status a:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .caret { animation: none; }
      .chip { transition: none; }
    }

  </style>
</head>
<body>
  <main class="tui">
    <!-- ============ hero ============ -->
    <header class="hero">
      <p class="prompt" aria-hidden="true"><span class="path">~/brad</span> <span class="sym">❯</span> <span>whoami</span></p>
      <h1 class="name"><span>brad</span><span class="last">flaugher<span class="caret" aria-hidden="true"></span></span></h1>
      <ul class="socials" aria-label="Elsewhere">
        <li>
          <a class="chip" href="https://x.com/BradFlaugher" rel="me noopener" aria-label="Brad Flaugher on X, @BradFlaugher">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <span>@BradFlaugher</span>
          </a>
        </li>
        <li>
          <a class="chip" href="https://github.com/bradflaugher" rel="me noopener" aria-label="Brad Flaugher on GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            <span>github/bradflaugher</span>
          </a>
        </li>
      </ul>
    </header>
  </main>

  <!-- ============ status bar ============ -->
  <footer class="status">
    <div class="status__inner">
      <span class="seg"><span>bradflaugher.com</span> <span aria-hidden="true">·</span> <a href="https://github.com/bradflaugher/bradflaugher.com" rel="noopener">src</a></span>
    </div>
  </footer>
</body>
</html>
