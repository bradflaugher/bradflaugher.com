version: 2

# Policy: patch vulnerabilities fast, refresh everything else rarely.
#
# - Security fixes come from Dependabot security updates (a repo setting, not
#   this file). They open a PR as soon as an advisory affects us. The schedule
#   and cooldown below only govern version updates, so they never delay a
#   security fix.
# - Version updates: one PR per quarter, majors included (read their release
#   notes before merging).
# - A release must be 30 days old before a version update picks it up, so a
#   broken or hijacked release has usually been pulled by then.

updates:
  # The site has no runtime or dev dependencies; the only thing to keep
  # current is the Actions the deploy workflow uses.
  # GitHub's advisories don't cover SHA-pinned Actions, so no security
  # update will ever come for these: the quarterly PR is what moves them.
  # The pins themselves are the defence against a hijacked tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 30
    # Without this, each action would get its own PR every quarter.
    groups:
      actions:
        patterns: ['*']
