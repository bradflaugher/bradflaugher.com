name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # "Run workflow" button in the Actions tab, for redeploying without a commit.
  workflow_dispatch:

# Least privilege by default; the job widens only what it needs.
permissions: {}

# Never run two deploys at once, and never cancel one mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare secrets live in this environment (Settings →
    # Environments), which only accepts deployments from main.
    environment:
      name: production
      url: https://bradflaugher.com
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publish only the files the site serves. `wrangler pages deploy`
      # ignores .cfignore, so deploying `./` put AGENTS.md, README.md,
      # package.json and .github/ on bradflaugher.com.
      - name: Stage public files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.*' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='LICENSE' \
            ./ _site/
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/_headers

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          command: pages deploy _site --project-name=bradflaugher --branch=main

      - name: Summarize deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Deployed to Cloudflare Pages"
            echo
            echo "- Production: https://bradflaugher.com"
            echo "- This deployment: ${DEPLOYMENT_URL}"
            echo "- Files: $(find _site -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
